<div class="nav-header">
    <span class="back-arrow" (click)="navigateToDashboard()">
      <svg class="arrow-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
      </svg>
    </span>
    <h2 class="title">Define Your Course Type</h2>

  <div class="options">

      <span class="icon">📚</span>

      <p>Create immersive learning journeys with videos, quizzes, and coding challenges.</p>

    <div class="card" (click)="navigateToPracticeTest()" [class.selected]="selectedType === 'test'">

      <p>Equip students for success with expertly crafted exam simulations.</p>
