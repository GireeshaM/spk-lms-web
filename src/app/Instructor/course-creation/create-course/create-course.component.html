<app-instructor-navbar></app-instructor-navbar>
<!-- Header Section (Blue background, title only) -->
<div class="header">
  <h1>Create Your Course</h1>
  <p>Share your knowledge and start your journey!</p>
</div>

<!-- ion Form -->
<form [formGroup]="courseForm" (ngSubmit)="onSubmit()">
  <div class="form-container">
    <!-- Left Column -->
    <div class="form-column">
      <div class="form-group">
        <label for="courseName">Course Name:</label>
        <input id="courseName" formControlName="courseName" type="text" placeholder="Enter course name">
      </div>

      <div class="form-group">
        <label for="domainName">Domain Name:</label>
        <input id="domainName" formControlName="domainName" type="text" placeholder="Enter domain name">
      </div>

      <div class="form-group">
        <label for="whatYouLearn">What You'll Learn:</label>
        <textarea id="whatYouLearn" formControlName="whatYouLearn" placeholder="Enter what you'll learn"></textarea>
      </div>

      <div class="form-group" formArrayName="preRequirements">
        <label>Pre-requirements (Points):</label>
        <div *ngFor="let preReq of preRequirements.controls; let i = index" class="pre-req-group">
          <input [formControlName]="i" type="text" placeholder="Enter pre-requirement">
          <button type="button" (click)="removePreRequirement(i)"
            *ngIf="preRequirements.controls.length > 1">Remove</button>
        </div>
        <button type="button" (click)="addPreRequirement()">Add Pre-requirement</button>
      </div>

      <div class="form-group">
        <label for="description">Description:</label>
        <textarea id="description" formControlName="description" placeholder="Enter course description"></textarea>
      </div>
    </div>

    <!-- Right Column -->
    <div class="form-column">
      <div class="form-group">
        <label for="demoVideo">Demo Video (MP4):</label>
        <input id="demoVideo" type="file" accept="video/mp4" (change)="onDemoVideoChange($event)">
      </div>

      <div class="form-group">
        <label for="duration">Duration (minutes):</label>
        <input id="duration" formControlName="duration" type="number" placeholder="Enter duration">
      </div>

      <div class="form-group">
        <label for="courseThumbnail">Course Thumbnail:</label>
        <input id="courseThumbnail" type="file" accept="image/*" (change)="onThumbnailChange($event)">
      </div>
    </div>
  </div>

  <!-- Submit Button -->
  <div class="submit-container">
    <button type="submit">Submit</button>
  </div>
</form>
