<div class="reviews-container">
  <div class="header">
    <h2>Student Reviews & Feedback</h2>
    <input type="text" placeholder="Search reviews..." [(ngModel)]="searchQuery" (input)="searchReviews()">
  </div>

  <div class="filters">
    <label>Sort by:</label>
    <select [(ngModel)]="filterType" (change)="applyFilter()">
      <option value="latest">Latest</option>
      <option value="mostLiked">Most Liked</option>
      <option value="topRated">Top Rated</option>
    </select>

    <label>Instructor:</label>
    <select [(ngModel)]="selectedInstructor" (change)="applyFilter()">
      <option value="all">All</option>
      <option *ngFor="let instructor of instructors" [value]="instructor">
        {{ instructor }}
      </option>
    </select>

    <label>Course:</label>
    <select [(ngModel)]="selectedCourse" (change)="applyFilter()">
      <option value="all">All</option>
      <option *ngFor="let course of courses" [value]="course">
        {{ course }}
      </option>
    </select>
    
    <div class="date-range">
      <label>Start Date:</label>
      <input type="date" [(ngModel)]="startDate" (change)="applyFilter()">
      <label>End Date:</label>
      <input type="date" [(ngModel)]="endDate" (change)="applyFilter()">
    </div>
  </div>

  <div *ngFor="let review of filteredReviews" class="review-card">
    <div class="student-info">
      <img [src]="review.studentImage" alt="Student Image">
      <div class="info">
        <h4>{{ review.studentName }}</h4>
        <span><strong>Course:</strong> {{ review.courseName }} &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
          <strong>Instructor:</strong> {{ review.instructorName }}</span>
        <p class="message">{{ review.message }}</p>
      </div>
      <button class="heart-btn" (click)="likeReview(review)">
        <span *ngIf="!review.isLiked">❤️</span>
        <span *ngIf="review.isLiked">💖</span>
      </button>
    </div>
    
    <div class="admin-reply">
      <p *ngIf="review.adminReply"><strong>Admin Reply:</strong> {{ review.adminReply }}</p>
      <div *ngIf="!review.adminReply">
        <textarea #replyBox placeholder="Write a reply..."></textarea>
        <button (click)="replyToReview(review, replyBox)">Reply</button>
      </div>
    </div>
  </div>

  <!-- Pagination -->
  <div class="pagination">
    <button (click)="changePage('previous')" [disabled]="currentPage === 1">Previous</button>
    <span>Page {{ currentPage }} of {{ totalPages }}</span>
    <button (click)="changePage('next')" [disabled]="currentPage === totalPages">Next</button>
  </div>
</div>
