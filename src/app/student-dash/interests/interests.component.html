<div class="container">
<div class="sidebar">
  <app-hnav></app-hnav>
</div>
</div>
<div class="d-flex">
  <!-- Sidebar -->
  

  <!-- Main Content -->
  <div class="main-content">
    <div class="interest-container text-center">
      <h2>WHAT ARE YOUR INTERESTS?</h2>
      <p>
        Please let us know topics of interest to you, so we can help identify content that would be most relevant to you.
      </p>

      <!-- Search Bar -->
      <div class="input-group mb-3 w-100 w-md-50 mx-auto">
        <input
          type="text"
          class="form-control"
          placeholder="Search topics of your interest"
          [(ngModel)]="searchQuery"
          (input)="filterSuggestions()"
        />
        <button class="btn btn-outline-secondary">
          <i class="fas fa-search"></i>
        </button>
      </div>

      <!-- My Interests -->
      <h5>My Interests</h5>
      <div class="d-flex flex-wrap gap-2 justify-content-center mb-4">
        <span
          *ngFor="let interest of myInterests"
          class="badge bg-success p-2 interest-item"
        >
          {{ interest }}
          <i
            class="fas fa-minus-circle action-icon"
            (click)="removeInterest(interest)"
          ></i>
        </span>
      </div>

      <!-- Suggestions -->
      <h5>Our Suggestions</h5>
      <div class="d-flex flex-wrap gap-2 justify-content-center">
        <span
          *ngFor="let suggestion of suggestions"
          class="badge bg-primary p-2 suggestion-item"
        >
          {{ suggestion }}
          <i
            class="fas fa-plus-circle action-icon"
            (click)="addInterest(suggestion)"
          ></i>
        </span>
      </div>
    </div>
  </div>
</div>
