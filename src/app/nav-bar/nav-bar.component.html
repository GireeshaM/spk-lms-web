<div class="d-flex">


  <div class="d-flex">
    <!-- Sidebar (Remains Unchanged) -->
    <div class="sidebar-container" [ngClass]="{'expanded': isExpanded}">
      <div class="d-flex flex-column flex-shrink-0 bg-light">
        <!-- Navigation Menu -->

      </div>
    </div>

    <!-- Unified Navbar Wrapper -->
    <div class="navbar-wrapper bg-light shadow-sm fixed-top w-100 px-3 d-flex align-items-center">

      <!-- Sidebar Toggle Button (Placed First) -->
      <!-- <button class="btn btn-dark me-3" (click)="toggleSidebar()">
        <i class="fa fa-bars"></i>
      </button>
       -->
      <!-- Logo Section with Increased Size -->
      <div class="navbar-logo me-3">
        <a class="navbar-brand d-flex align-items-center" routerLink="/" (click)="navigateHome()">
          <img src="images/sushma.png" alt="logo" class="logo-img" />
        </a>
      </div>

      <!-- Main Navbar (Navigation Links & Others) -->
      <nav class="navbar navbar-expand-lg navbar-light flex-grow-1">
        <div class="container-fluid">
          <!-- Toggle Button for Mobile -->
          <button class="navbar-toggler ms-auto" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
            aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
          </button>

          <!-- Navbar Links -->
          <div class="collapse navbar-collapse" [ngClass]="{'show': isExpanded}" id="navbarNav">
            <ul class="navbar-nav me-auto">
              <li class="nav-item">
                <a class="nav-link" routerLink="./student-dashboard">Student</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" routerLink="./instructor-dashboard">Instructor</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" routerLink="/admin-dashboard">Admin</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" routerLink="/create-path">Workplace Learning</a>
              </li>
            </ul>

            <!-- Search Form -->
            <form class="d-flex mobile-search-bar w-50" (ngSubmit)="onSearch()">
              <div class="input-group">
                <span class="input-group-text"><i class="fa fa-search"></i></span>
                <input type="text" class="form-control" placeholder="Search for anything" [(ngModel)]="searchQuery"
                  name="searchQuery" required>
              </div>
            </form>

            <!-- Right Side Icons -->
            <ul class="navbar-nav ms-auto">
              <li class="nav-item">
                <a class="nav-link d-flex align-items-center" routerLink="/courses">
                  <i class="far fa-book"></i>
                  <span class="d-lg-none ms-2">My Courses</span>
                </a>
              </li>
              <li class="nav-item">
                <a class="nav-link d-flex align-items-center" routerLink="/wishlist">
                  <i class="far fa-heart"></i>
                  <span class="d-lg-none ms-2">Wishlist</span>
                </a>
                           
              </li>
              <li class="nav-item">
                <a class="nav-link d-flex align-items-center" routerLink="/cart">
                  <i class="fa fa-shopping-cart"></i>
                  <span class="d-lg-none ms-2">Cart</span>
                </a>
              </li>
              <li class="nav-item dropdown">
                <a class="nav-link" href="#" id="notificationDropdown" role="button" data-bs-toggle="dropdown"
                  aria-expanded="false">
                  <i class="far fa-bell"></i>
                </a>
                <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="notificationDropdown">
                  <li *ngFor="let notification of notifications" class="dropdown-item d-flex align-items-center">
                    <img [src]="notification.profilePhoto" alt="Profile Photo" class="rounded-circle me-2" width="40"
                      height="40">
                    <div>
                      <div class="fw-bold">{{ notification.sender }}</div>
                      <div class="text-muted">{{ notification.subject }}</div>
                    </div>
                  </li>
                  <li>
                    <hr class="dropdown-divider">
                  </li>
                  <li><a class="dropdown-item text-center" href="/notifications">See all notifications</a></li>
                </ul>
              </li>
              <li class="nav-item">
                <a class="nav-link d-flex align-items-center" (click)="openlogin()">
                  <i class="fa fa-user"></i>
                  <span class="d-lg-none ms-2">Login</span>
                </a>
              </li>
              <li class="nav-item">
                <a class="nav-link d-flex align-items-center" (click)="openRegistration()">
                  <i class="fa fa-user-plus"></i>
                  <span class="d-lg-none ms-2">Sign Up</span>
                </a>
              </li>
            </ul>
          </div>
        </div>
      </nav>
    </div>
  </div>
</div>
